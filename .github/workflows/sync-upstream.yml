name: Sync Upstream
on:
  schedule:
    # 每天北京时间凌晨 3 点运行 (UTC 19:00)
    - cron: '0 19 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取所有历史记录
          fetch-depth: 0

      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: 原作者用户名/原仓库名
          upstream_sync_branch: main
          target_sync_branch: main
          # 如果有冲突，是否强制覆盖（谨慎开启）
          # git_push_force: true
